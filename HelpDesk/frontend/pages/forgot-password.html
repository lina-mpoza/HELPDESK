<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — IT Helpdesk</title>

    <link rel="stylesheet" href="../css/base.css?v=4" />
    <link rel="stylesheet" href="../css/layout.css?v=4" />
    <link rel="stylesheet" href="../css/components.css?v=4" />
    <link rel="stylesheet" href="../css/auth.css?v=4" />
</head>
<body class="auth-page">

    <div class="auth-wrapper">

        <!-- Left: branding -->
        <aside class="auth-branding">
            <a href="../index.html" class="auth-brand-link">
                <img src="../assets/images/ortambo-logo.png"
                     alt="O.R. Tambo District Municipality"
                     class="auth-logo" />
            </a>
            <h1 class="auth-brand-title">IT Helpdesk</h1>
            <p class="auth-brand-subtitle">O.R. Tambo District Municipality</p>
            <p class="auth-brand-text">
                Reset your password in two simple steps.
            </p>
        </aside>

        <!-- Right: form -->
        <main class="auth-form-side">
            <div class="auth-card">

                <h2 class="auth-card-title" id="pageTitle">Forgot your password?</h2>
                <p class="auth-card-subtitle" id="pageSubtitle">
                    Enter your registered email and we'll send you a one-time code.
                </p>

                <!-- STEP 1 -->
                <form id="stepOneForm" novalidate>

                    <div class="form-group">
                        <label for="email">Your registered email</label>
                        <input type="email" id="email" class="form-control"
                               placeholder="name@ortambodm.gov.za"
                               autocomplete="email" required />
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="sendOtpBtn">
                        Send OTP
                    </button>

                    <p id="stepOneMessage" class="form-message"></p>

                </form>

                <!-- STEP 2 -->
                <form id="stepTwoForm" style="display:none;" novalidate>

                    <div class="form-group">
                        <label for="otp">One-time code</label>
                        <input type="text" id="otp" class="form-control"
                               placeholder="6-digit code" maxlength="6"
                               inputmode="numeric" pattern="[0-9]{6}" required />
                    </div>

                    <div class="form-group">
                        <label for="newPassword">New password</label>
                        <input type="password" id="newPassword" class="form-control"
                               minlength="6" placeholder="Minimum 6 characters" required />
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm new password</label>
                        <input type="password" id="confirmPassword" class="form-control"
                               minlength="6" placeholder="Retype new password" required />
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="resetBtn">
                        Reset password
                    </button>

                    <button type="button" id="backToStepOne"
                            class="btn btn-outline btn-block"
                            style="margin-top: 10px;">
                        Use a different email
                    </button>

                    <p id="stepTwoMessage" class="form-message"></p>

                </form>

                <p class="auth-alt-link">
                    Remembered it? <a href="login.html">Back to sign in</a>
                </p>

            </div>
        </main>

    </div>

    <script src="../js/api/apiClient.js"></script>
    <script src="../js/auth/forgotPassword.js"></script>

</body>
</html>
