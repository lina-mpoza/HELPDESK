<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up — O.R. Tambo District Municipality IT Helpdesk</title>

    <link rel="stylesheet" href="../css/base.css?v=4" />
    <link rel="stylesheet" href="../css/layout.css?v=4" />
    <link rel="stylesheet" href="../css/components.css?v=4" />
    <link rel="stylesheet" href="../css/auth.css?v=4" />
</head>
<body class="auth-page">

    <div class="auth-wrapper">

        <!-- Left: branding -->
        <aside class="auth-branding">
            <a href="../index.html" class="auth-brand-link">
                <img src="../assets/images/ortambo-logo.png"
                     alt="O.R. Tambo District Municipality"
                     class="auth-logo" />
            </a>
            <h1 class="auth-brand-title">IT Helpdesk</h1>
            <p class="auth-brand-subtitle">O.R. Tambo District Municipality</p>
            <p class="auth-brand-text">
                Create your account to submit and track IT support tickets.
            </p>
        </aside>

        <!-- Right: form -->
        <main class="auth-form-side">
            <div class="auth-card">

                <h2 class="auth-card-title">Create your account</h2>
                <p class="auth-card-subtitle">
                    All fields marked <span class="req">*</span> are required.
                </p>

                <form id="signupForm" novalidate>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First name <span class="req">*</span></label>
                            <input type="text" id="firstName" class="form-control" required />
                        </div>

                        <div class="form-group">
                            <label for="lastName">Last name <span class="req">*</span></label>
                            <input type="text" id="lastName" class="form-control" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="workEmail">Work email</label>
                        <input type="email" id="workEmail" class="form-control"
                               placeholder="name@ortambodm.gov.za" />
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="cellNo">Cell number</label>
                            <input type="tel" id="cellNo" class="form-control"
                                   placeholder="0XX XXX XXXX" maxlength="12" />
                        </div>

                        <div class="form-group">
                            <label for="staffNo">Staff number</label>
                            <input type="text" id="staffNo" class="form-control"
                                   placeholder="e.g. ORT-00123" maxlength="15" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="username">Username <span class="req">*</span></label>
                        <input type="text" id="username" class="form-control" required />
                    </div>

                    <div class="form-group">
                        <label for="password">Password <span class="req">*</span></label>
                        <input type="password" id="password" class="form-control"
                               minlength="6" required />
                        <small class="form-hint">Minimum 6 characters.</small>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm password <span class="req">*</span></label>
                        <input type="password" id="confirmPassword" class="form-control" required />
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                        Create account
                    </button>

                    <p id="signupMessage" class="form-message"></p>

                </form>

                <p class="auth-alt-link">
                    Already have an account? <a href="login.html">Sign in</a>
                </p>

            </div>
        </main>

    </div>

    <script src="../js/api/apiClient.js"></script>
    <script src="../js/auth/signup.js"></script>
</body>
</html>
