<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — O.R. Tambo District Municipality IT Helpdesk</title>

    <link rel="stylesheet" href="../css/base.css?v=4" />
    <link rel="stylesheet" href="../css/layout.css?v=4" />
    <link rel="stylesheet" href="../css/components.css?v=4" />
    <link rel="stylesheet" href="../css/auth.css?v=4" />
</head>
<body class="auth-page">

    <div class="auth-wrapper">

        <!-- Left: branding -->
        <aside class="auth-branding">
            <a href="../index.html" class="auth-brand-link">
                <img src="../assets/images/ortambo-logo.png"
                     alt="O.R. Tambo District Municipality"
                     class="auth-logo" />
            </a>
            <h1 class="auth-brand-title">IT Helpdesk</h1>
            <p class="auth-brand-subtitle">O.R. Tambo District Municipality</p>
            <p class="auth-brand-text">
                Sign in to submit tickets, track progress, and manage IT support.
            </p>
        </aside>

        <!-- Right: form -->
        <main class="auth-form-side">
            <div class="auth-card">

                <h2 class="auth-card-title">Sign in</h2>
                <p class="auth-card-subtitle">Enter your credentials to continue.</p>

                <form id="loginForm" novalidate>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" class="form-control"
                               autocomplete="username" required />
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control"
                               autocomplete="current-password" required />
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                        Sign in
                    </button>

                    <p id="loginMessage" class="form-message"></p>

                </form>

                <p class="auth-alt-link" style="margin-top: 0;">
                    <a href="forgot-password.html">Forgot your password?</a>
                </p>

                <p class="auth-alt-link">
                    Don't have an account? <a href="signup.html">Sign up</a>
                </p>

            </div>
        </main>

    </div>

    <script src="../js/api/apiClient.js"></script>
    <script src="../js/auth/session.js"></script>
    <script src="../js/auth/login.js"></script>
</body>
</html>
